name: Apply main cockpit watchlist sync

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/apply-main-watchlist-sync.mjs'
      - '.github/workflows/apply-main-watchlist-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted watchlist patch
        run: node scripts/apply-main-watchlist-sync.mjs
      - name: Verify only intended storage behavior changed
        run: |
          git diff --check
          grep -q '/api/user-sync/snapshot' app/page.tsx
          grep -q '/api/user-sync/watchlist' app/page.tsx
          ! grep -q 'cockpit-favorites' app/page.tsx
      - name: Commit synchronized favorites
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Synchronize main cockpit favorites with Neon watchlist'
          git push origin HEAD:feat/flutter-mobile-sync
