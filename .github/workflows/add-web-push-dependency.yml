name: Add Web Push Dependency
on:
  push:
    branches: [feat/precommercialization-audit]
    paths: ['.github/workflows/add-web-push-dependency.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/precommercialization-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install web-push --save --no-audit --no-fund
      - run: npm install @types/web-push --save-dev --no-audit --no-fund
      - run: git diff --check
      - name: Commit dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add Web Push delivery dependency'
          git push origin HEAD:feat/precommercialization-audit
