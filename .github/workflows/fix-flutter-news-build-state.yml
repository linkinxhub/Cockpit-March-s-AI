name: Fix Flutter News Build State
on:
  push:
    branches: [feat/precommercialization-audit]
    paths: ['scripts/fix-flutter-news-build-state.mjs','.github/workflows/fix-flutter-news-build-state.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/precommercialization-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-flutter-news-build-state.mjs
      - run: git diff --check
      - name: Commit targeted fix
        run: |
          if git diff --quiet -- mobile/lib/app_shell.dart; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/app_shell.dart
          git commit -m 'Avoid build-time state mutation in Flutter News'
          git push origin HEAD:feat/precommercialization-audit
