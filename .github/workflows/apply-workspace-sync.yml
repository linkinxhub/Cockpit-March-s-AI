name: Apply cockpit workspace sync

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/apply-workspace-sync.mjs'
      - '.github/workflows/apply-workspace-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted workspace patch
        run: node scripts/apply-workspace-sync.mjs
      - name: Verify durable workspace wiring
        run: |
          git diff --check
          grep -q '/api/user-sync/workspace' app/page.tsx
          ! grep -q 'cockpit-alerts-v1' app/page.tsx
          ! grep -q 'cockpit-profile-v1' app/page.tsx
          ! grep -q 'cockpit-passports-v1' app/page.tsx
      - name: Commit workspace sync
        run: |
          if git diff --quiet -- app/page.tsx; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Synchronize cockpit business workspace with Neon'
          git push origin HEAD:feat/flutter-mobile-sync
