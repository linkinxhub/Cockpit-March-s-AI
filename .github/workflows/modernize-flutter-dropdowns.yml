name: Modernize Flutter dropdowns

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/modernize-flutter-dropdowns.mjs'
      - '.github/workflows/modernize-flutter-dropdowns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/modernize-flutter-dropdowns.mjs
      - run: git diff --check
      - name: Commit Flutter dropdown modernization
        run: |
          if git diff --quiet -- mobile; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile
          git commit -m 'Modernize Flutter dropdown form fields'
          git push origin HEAD:feat/flutter-mobile-sync
