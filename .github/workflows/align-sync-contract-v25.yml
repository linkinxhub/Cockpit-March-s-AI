name: Align Sync Contract v2.5
on:
  push:
    branches: [feat/precommercialization-audit]
    paths: ['scripts/align-sync-contract-v25.mjs','.github/workflows/align-sync-contract-v25.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/precommercialization-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/align-sync-contract-v25.mjs
      - run: git diff --check
      - name: Commit v2.5 contract alignment
        run: |
          if git diff --quiet -- tests/sync-contract.test.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/sync-contract.test.mjs
          git commit -m 'Align Web Flutter contract with commercial v2.5'
          git push origin HEAD:feat/precommercialization-audit
