name: Flutter Guardian

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-guardian.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-guardian.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze mobile app
        run: flutter analyze
      - name: Run Flutter tests when present
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter test files yet; analyze is the current compile gate.'
          fi
