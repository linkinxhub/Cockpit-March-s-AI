name: Fix Flutter shell syntax

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/fix-flutter-shell-brace.mjs'
      - '.github/workflows/fix-flutter-shell-brace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-flutter-shell-brace.mjs
      - run: git diff --check
      - name: Commit Flutter syntax fix
        run: |
          if git diff --quiet -- mobile/lib/app_shell.dart; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/app_shell.dart
          git commit -m 'Fix Flutter shell syntax'
          git push origin HEAD:feat/flutter-mobile-sync
