name: Build Test APK
on:
  push:
    branches: [feat/precommercialization-audit]
    paths: ['.github/workflows/build-test-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build installable test APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://cockpit-march-s-ai.vercel.app
      - name: Verify APK
        run: test -s mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk Cockpit-Marches-AI-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-marches-ai-test-apk
          path: Cockpit-Marches-AI-test.apk
          if-no-files-found: error
          retention-days: 7
