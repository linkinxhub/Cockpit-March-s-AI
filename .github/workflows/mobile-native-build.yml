name: Mobile Native Build Guardian

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-build.yml'

jobs:
  android:
    name: Android release compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build Android App Bundle
        working-directory: mobile
        run: flutter build appbundle --release
      - name: Verify bundle exists
        run: test -s mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Build installable Android test APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://cockpit-march-s-ai.vercel.app
      - name: Prepare APK artifact
        run: |
          test -s mobile/build/app/outputs/flutter-apk/app-release.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk Cockpit-Marches-AI-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-marches-ai-test-apk
          path: Cockpit-Marches-AI-test.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS release compile no codesign
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build iOS without signing
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Verify iOS app exists
        run: test -d mobile/build/ios/iphoneos/Runner.app
