name: Synchronize package lock

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - '.github/workflows/sync-package-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Regenerate lock metadata from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify Neon dependency is locked
        run: |
          grep -q '"@neondatabase/serverless": "^1.0.2"' package-lock.json
          grep -q 'node_modules/@neondatabase/serverless' package-lock.json
          git diff --check
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Synchronize Neon dependency lockfile'
          git push origin HEAD:feat/flutter-mobile-sync
