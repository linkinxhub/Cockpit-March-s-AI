name: Fix decision note map type

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/fix-decision-note-map-type.mjs'
      - '.github/workflows/fix-decision-note-map-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted TypeScript fix
        run: node scripts/fix-decision-note-map-type.mjs
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'payload.notes.map((item: { id: unknown;' app/page.tsx
      - name: Commit TypeScript fix
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Type decision note map payload'
          git push origin HEAD:feat/flutter-mobile-sync
