name: APK Only Test Build

on:
  pull_request:
    paths:
      - '.github/workflows/apk-only-test.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build APK connected to production API
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://cockpit-march-s-ai.vercel.app
      - name: Prepare APK
        run: |
          test -s mobile/build/app/outputs/flutter-apk/app-release.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk Cockpit-Marches-AI-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-marches-ai-test-apk
          path: Cockpit-Marches-AI-test.apk
          retention-days: 7
