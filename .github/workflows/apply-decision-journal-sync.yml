name: Apply decision journal sync

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/apply-decision-journal-sync.mjs'
      - '.github/workflows/apply-decision-journal-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted decision journal patch
        run: node scripts/apply-decision-journal-sync.mjs
      - name: Verify durable journal wiring
        run: |
          git diff --check
          grep -q '/api/user-sync/decision-notes' app/page.tsx
          ! grep -q 'cockpit-journal-v1' app/page.tsx
      - name: Commit synchronized journal
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Synchronize cockpit decision journal with Neon'
          git push origin HEAD:feat/flutter-mobile-sync
