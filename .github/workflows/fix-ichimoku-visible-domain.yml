name: Fix Ichimoku visible domain

on:
  push:
    branches: [feat/flutter-mobile-sync]
    paths:
      - 'scripts/fix-ichimoku-visible-domain.mjs'
      - '.github/workflows/fix-ichimoku-visible-domain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted Ichimoku domain patch
        run: node scripts/fix-ichimoku-visible-domain.mjs
      - name: Verify domain isolation
        run: |
          git diff --check
          grep -q 'domain={technicalStudy.yDomain}' app/page.tsx
          grep -q 'focusData = visibleData.slice(-48)' app/page.tsx
          grep -q 'signal.price >= yDomain\[0\]' app/page.tsx
      - name: Commit chart fix
        run: |
          if git diff --quiet -- app/page.tsx; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Keep Ichimoku signals inside visible chart range'
          git push origin HEAD:feat/flutter-mobile-sync
