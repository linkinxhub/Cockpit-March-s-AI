name: Fix Web Push Manifest
on:
  push:
    branches: [feat/precommercialization-audit]
    paths: ['scripts/fix-webpush-manifest.mjs','.github/workflows/fix-webpush-manifest.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/precommercialization-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-webpush-manifest.mjs
      - run: git diff --check
      - name: Commit manifest update
        run: |
          if git diff --quiet -- app/api/sync/manifest/route.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/sync/manifest/route.ts
          git commit -m 'Mark Web Push provider delivery ready'
          git push origin HEAD:feat/precommercialization-audit
